<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Padel-HUB">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#3358ff"/>
      <stop offset="1" stop-color="#1b34cc"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6ecff"/>
    </linearGradient>
    <!-- máscara: blanco = paleta visible, negro = deja ver el fondo (agujeros/garganta) -->
    <mask id="cut">
      <rect width="512" height="512" fill="black"/>
      <ellipse cx="256" cy="192" rx="118" ry="130" fill="white"/>
      <rect x="232" y="322" width="48" height="152" rx="24" fill="white"/>
      <g fill="black">
        <circle cx="210" cy="146" r="13"/><circle cx="256" cy="146" r="13"/><circle cx="302" cy="146" r="13"/>
        <circle cx="210" cy="190" r="13"/><circle cx="256" cy="190" r="13"/><circle cx="302" cy="190" r="13"/>
        <circle cx="210" cy="234" r="13"/><circle cx="256" cy="234" r="13"/><circle cx="302" cy="234" r="13"/>
      </g>
      <!-- garganta con forma de corazón (rasgo típico de la paleta) -->
      <path fill="black" d="M256 352c-22-15-33-25-33-38 0-9 7-15 15-15 7 0 13 4 18 11 5-7 11-11 18-11 8 0 15 6 15 15 0 13-11 23-33 38z"/>
    </mask>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <g transform="rotate(-8 256 256)">
    <rect width="512" height="512" fill="url(#face)" mask="url(#cut)"/>
  </g>
</svg>
