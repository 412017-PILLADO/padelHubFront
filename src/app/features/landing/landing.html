  <defs>

      <line x1="7" y1="82" x2="68" y2="82" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.85" fill="none" />
      <line x1="37.5" y1="18" x2="37.5" y2="82" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.7" fill="none" />

<!-- ===================================================================
     Cada plantilla es una cáscara con su propio markup y su propia hoja (ver shells/). Acá solo se
     elige cuál: la del club, o la del preview `?plantilla=` si vino en la URL. `plantilla()` ya es
     el código de la cáscara que SE PUEDE dibujar (shellDePlantilla en core/landing/plantillas.ts):
     un tenant en D llega acá como 'A', y el `data-tpl` del host dice 'A' también, así las
     reglas de layout del afiche enganchan. El @default es la A, la plantilla por defecto.
     =================================================================== -->
@switch (plantilla()) {
  @case ('B') {
    <app-shell-b (abrirArrepentimiento)="abrirArrepentimiento()" (abrirPolitica)="abrirPolitica()" />
  }
  @case ('C') {
    <app-shell-c (abrirArrepentimiento)="abrirArrepentimiento()" (abrirPolitica)="abrirPolitica()" />
  }
  @case ('E') {
    <app-shell-e (abrirArrepentimiento)="abrirArrepentimiento()" (abrirPolitica)="abrirPolitica()" />
  }
  @default {
    <app-shell-a (abrirArrepentimiento)="abrirArrepentimiento()" (abrirPolitica)="abrirPolitica()" />
  }
}

<!-- ===================================================================
     Botón de arrepentimiento (Res. 424/2020): el link vive en el pie de cada plantilla; el modal
     es único y se comparte entre todas. Componente autocontenido (ver arrepentimiento-modal/).
     =================================================================== -->
@if (showArrep()) {
  <app-arrepentimiento-modal (cerrar)="showArrep.set(false)" />
}

<!-- ===================================================================
     Política de cancelación: texto libre del club (link en el pie de cada plantilla y en el
     bloque de seña del éxito). Componente autocontenido (ver politica-modal/).
     =================================================================== -->
@if (showPolitica() && config()?.politicaCancelacion) {
  <app-politica-modal [texto]="config()!.politicaCancelacion!" (cerrar)="showPolitica.set(false)" />
}

<!-- ===================================================================
     Preview de plantillas (herramienta de venta): solo aparece si vino `?plantilla=` en la URL.
     Deja probar en vivo, sin persistir nada, las plantillas que tienen cáscara (ver
     core/landing/plantillas.ts: CODIGOS_CON_SHELL; landing.ts: opcionesPreview).
     =================================================================== -->
<!-- `!previewSinSelector()`: adentro del iframe de la galería del panel (`?panel=1`) este selector
     sería un SEGUNDO control que cambia lo que se ve sin tocar el formulario — se elegiría una
     plantilla y se guardaría otra. Ver club.store.ts · previewSinSelector. -->
@if (!previewSinSelector() && previewPlantilla(); as activa) {
  <div class="tpl-pill" role="group" aria-label="Preview de plantilla">
    @for (opt of opcionesPreview; track opt.codigo) {
      <button type="button" class="tpl-opt" [class.on]="opt.codigo === activa"
        [attr.aria-pressed]="opt.codigo === activa" [attr.title]="opt.nombre"
        (click)="setPreviewPlantilla(opt.codigo)">{{ opt.codigo }}</button>
    }
  </div>
}
