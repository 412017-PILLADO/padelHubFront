<nav class="adminnav">
  <div class="brand">
    @if (logoSrc(); as logo) {
      <span class="brand-logo"><img [src]="logo" [alt]="tenantName()" /></span>
    } @else {
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none">
          <g transform="rotate(35 20 20)">
            <mask id="paddleNav">
              <rect width="40" height="40" fill="#000" />
              <path d="M20 2.2 C26.6 2.2 30.5 7.2 30.5 13.4 C30.5 19 27.2 23.2 23.8 24.6 L23.2 24.9 L24 30.4 C24.3 32.6 22.6 33.6 20 33.6 C17.4 33.6 15.7 32.6 16 30.4 L16.8 24.9 L16.2 24.6 C12.8 23.2 9.5 19 9.5 13.4 C9.5 7.2 13.4 2.2 20 2.2 Z" fill="#fff" />
              <rect x="16.6" y="30.2" width="6.8" height="8.8" rx="2.4" fill="#fff" />
              <g fill="#000">
                <circle cx="15.2" cy="10" r="1.45" /><circle cx="20" cy="9.3" r="1.45" /><circle cx="24.8" cy="10" r="1.45" />
                <circle cx="15.2" cy="15" r="1.45" /><circle cx="20" cy="14.3" r="1.45" /><circle cx="24.8" cy="15" r="1.45" />
                <circle cx="17.4" cy="19.6" r="1.45" /><circle cx="22.6" cy="19.6" r="1.45" />
              </g>
            </mask>
            <rect width="40" height="40" fill="currentColor" mask="url(#paddleNav)" />
            <path d="M16.6 33.6 h6.8 v3 a2.4 2.4 0 0 1 -2.4 2.4 h-2 a2.4 2.4 0 0 1 -2.4 -2.4 Z" fill="var(--paddle-grip, currentColor)" />
          </g>
        </svg>
      </span>
    }
    <div class="logo-type">
      <div class="name display">{{ tenantName() }}</div>
      <div class="sub eyebrow"><span class="dot"></span>Panel</div>
    </div>
  </div>

  <div class="links">
    <a class="navlink" routerLink="/admin" routerLinkActive="on" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: true }" aria-label="Turnos del día" (click)="guardNav($event)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Turnos</span>
    </a>
    <a class="navlink" routerLink="/admin/config" routerLinkActive="on" ariaCurrentWhenActive="page" aria-label="Configurar agenda" (click)="guardNav($event)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>Agenda</span>
    </a>
    <button type="button" class="navlink out" (click)="logout()" aria-label="Salir">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span>Salir</span>
    </button>
  </div>
</nav>
